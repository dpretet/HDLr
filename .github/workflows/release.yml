name: Release Multi-Python

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build
        run: |
          chmod +x flow.sh
          ./flow.sh build

      - name: Prepare artifact name
        id: prep
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          PYVER=${{ matrix.python-version }}
          if [ "${{ runner.os }}" = "Linux" ]; then
            NAME="hdlr-${VERSION}-linux-py${PYVER}-x86_64"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            NAME="hdlr-${VERSION}-macos-py${PYVER}-arm64"
          else
            NAME="hdlr-${VERSION}-windows-py${PYVER}-x86_64.exe"
          fi
          echo "ASSET_NAME=$NAME" >> $GITHUB_OUTPUT

      - name: Move binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/hdlr.exe dist/${{ steps.prep.outputs.ASSET_NAME }}
          else
            cp dist/hdlr dist/${{ steps.prep.outputs.ASSET_NAME }}
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
